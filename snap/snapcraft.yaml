name: clamtk-rs
base: core24
version: '1.0.0'
summary: A GTK4 graphical frontend for ClamAV
title: ClamTK-rs
contact: lapisdecor@gmail.com
issues: https://github.com/lapisdecor/clamtk-rs/issues
source-code: https://github.com/lapisdecor/clamtk-rs
website: https://github.com/lapisdecor/clamtk-rs
description: |
  Clamtk-rs is a lightweight, user-friendly graphical frontend for ClamAV
  written in Rust with GTK4. It provides on-demand virus scanning, virus
  signature updates (freshclam), a quarantine manager, scan history and
  detailed scan settings.

  The snap bundles its own ClamAV (clamscan and freshclam) and runs under
  strict confinement. Virus definitions are downloaded automatically on the
  first scan and can be refreshed from the Update Signatures page.
license: GPL-3.0-or-later
grade: stable
confinement: strict
icon: data/icons/com.gatochalupa.clamtk-rs.png

slots:
  dbus-svc:
    interface: dbus
    bus: session
    name: com.gatochalupa.clamtk-rs

apps:
  clamtk-rs:
    command: bin/clamtk-rs-launcher
    extensions: [gnome]
    desktop: data/com.gatochalupa.clamtk-rs.desktop
    common-id: com.gatochalupa.clamtk-rs
    plugs:
      - home
      - network
      - mount-observe
      - removable-media

parts:
  clamtk-rs:
    plugin: rust
    source: .
    rust-channel: stable
    rust-inherit-ldflags: true
    build-attributes:
      - enable-patchelf
    build-packages:
      - build-essential
      - libgtk-4-dev
      - libglib2.0-dev-bin
      - patchelf
    stage-packages:
      - clamav
      - clamav-freshclam
    build-environment:
      - PATH: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/snap/bin"
      - LD_LIBRARY_PATH: ""
      - LDFLAGS: "-Wl,-rpath=\\$ORIGIN/../usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR"

  launcher:
    plugin: dump
    source: snap/local
    organize:
      clamtk-rs-launcher: bin/clamtk-rs-launcher

  desktop:
    plugin: dump
    source: data
    organize:
      com.gatochalupa.clamtk-rs.desktop: data/com.gatochalupa.clamtk-rs.desktop
      icons/scalable/apps/com.gatochalupa.clamtk-rs.svg: usr/share/icons/hicolor/scalable/apps/com.gatochalupa.clamtk-rs.svg
      icons/com.gatochalupa.clamtk-rs.png: usr/share/icons/hicolor/512x512/apps/com.gatochalupa.clamtk-rs.png
